  <button id="show">Mostrar imagen</button>
  <button id="download">Descargar .webp</button>
  <div><img id="img" alt="imagen resultante" style="max-width:50%;display:block;margin-top:10px"></div>

<script>
function hexdumpToUint8Array(hexdump) {
  // eliminar offsets (ej: "00000000:"), espacios y caracteres no hex
  const hex = hexdump
    .replace(/^[\\da-fA-F]+:\\s*/gm, '')
    .replace(/\\s+/g, '')
    .replace(/[^0-9a-fA-F]/g, '');

  if (hex.length % 2 !== 0) {
    throw new Error('Longitud hex impar');
  }

  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < bytes.length; i++) {
    bytes[i] = parseInt(hex.substr(i*2, 2), 16);
  }
  return bytes;
}

document.getElementById('show').addEventListener('click', () => {
  try {
    const hex = document.getElementById('hex').value;
    const bytes = hexdumpToUint8Array(hex);
    const blob = new Blob([bytes], { type: 'image/webp' });
    const url = URL.createObjectURL(blob);
    document.getElementById('img').src = url;
    // opcional: revokeObjectURL después de cierto tiempo si ya no se necesita
    // setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) {
    alert(e.message);
  }
});

document.getElementById('download').addEventListener('click', () => {
  try {
    const hex = document.getElementById('hex').value;
    const bytes = hexdumpToUint8Array(hex);
    const blob = new Blob([bytes], { type: 'image/webp' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'salida.webp';
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (e) {
    alert(e.message);
  }
});
</script>
